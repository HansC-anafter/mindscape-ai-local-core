[databases]
mindscape_core = host=postgres port=5432 dbname=mindscape_core
mindscape_vectors = host=postgres port=5432 dbname=mindscape_vectors

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /tmp/pgbouncer-userlist.txt
pool_mode = transaction
max_client_conn = 500
default_pool_size = 30
min_pool_size = 5
reserve_pool_size = 10
reserve_pool_timeout = 5
idle_transaction_timeout = 60
query_wait_timeout = 30
server_idle_timeout = 60
server_lifetime = 3600
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
admin_users = mindscape
stats_users = mindscape
log_connections = 1
log_disconnections = 1
