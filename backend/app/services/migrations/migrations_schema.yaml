# migrations.yaml schema
# Location: each capability root, for example backend/app/capabilities/example/migrations.yaml

# Database type (required)
db: sqlite | postgres

# Capability dependencies (optional)
depends_on:
  - capability_code@version  # Example: "mind_lens@1.0.0"
  - another_capability@latest

# Migration revision list (required)
revisions:
  - "20251228000001"  # Alembic revision ID using timestamp format

# Environment requirements (optional)
environment_requirements:
  postgres:
    extensions:
      - vector  # pgvector extension
    min_version: "12.0"
  sqlite:
    min_version: "3.35.0"

# Migration paths relative to the capability root (optional)
# If omitted, the orchestrator searches the standard alembic/{db_type}/versions/ path.
migration_paths:
  - "migrations/versions/"  # Optional custom path
