code: comfyui_runtime
display_name: "ComfyUI Runtime"
version: "1.2.0"
type: feature
aol_maturity: AOL-2
description: "Infrastructure management for ComfyUI rendering engine. Supports local GPU (CUDA/MPS) and remote execution."
category: infrastructure
tags:
  - rendering
  - infrastructure
  - gpu
  - comfyui

portability:
  min_local_core_version: "0.9.0"
  environments:
    - local-core
    - cloud
  degradation_strategy: graceful

host_resource_lanes:
  comfyui_runtime:flux2_klein_true_v2_q6_local:
    label: "FLUX2 Klein True V2 Q6 Local Lane"
    kind: generation_lane
    resource_flavor: local.mps.comfyui
    profile_id: vr_flux2_klein_true_v2_q6_local
    requirements:
      memory_mb: 16384
      memory_source: declared_manifest_model_footprint
      cpu_weight: 4
      exclusive_groups:
        - mps_generation
        - comfyui_runtime
      resource_flavor: local.mps.comfyui

dependencies:
  required: []
  optional:
    - name: storage
      code: storage
      degraded_features:
        - external_artifact_persistence
      fallback: use_local_runtime_artifact_refs
    - name: video_renderer
      code: video_renderer
      degraded_features:
        - video_renderer_workflow_source_sync
      fallback: use_comfyui_owned_workflow_templates
    - name: motion_runtime
      code: motion_runtime
      degraded_features:
        - motion_runtime_workflow_source_sync
      fallback: use_comfyui_owned_workflow_templates

object_exports:
  - kind: comfyui_workflow
    display_name: "ComfyUI Workflow"
    canonical_schema: capabilities.comfyui_runtime.schema.workflow_asset
    id_field: workflow_id
    selector_families: [object_root, graph_node]
    indexer_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:sync_workflow_index
    mention_fields:
      - workflow_id
      - display_name
      - source_template_id
    summary_fields:
      - workflow_id
      - display_name
      - readiness_status
      - source_pack_code
      - workflow_format
    supports:
      - summary
      - detail
      - actions
      - meeting_projection
      - graph_projection
  - kind: comfyui_model_asset
    display_name: "ComfyUI Model Asset"
    canonical_schema: capabilities.comfyui_runtime.schema.workflow_asset
    id_field: model_asset_id
    selector_families: [object_root, pack_local_path]
    indexer_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:sync_model_index
    mention_fields:
      - model_asset_id
      - filename
      - display_name
    summary_fields:
      - model_asset_id
      - role
      - filename
      - compatibility_status
    supports:
      - summary
      - graph_projection
  - kind: comfyui_custom_node_asset
    display_name: "ComfyUI Custom Node Asset"
    canonical_schema: capabilities.comfyui_runtime.schema.workflow_asset
    id_field: custom_node_asset_id
    selector_families: [object_root, graph_node]
    indexer_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:sync_custom_node_index
    mention_fields:
      - custom_node_asset_id
      - node_class
      - node_family
    summary_fields:
      - custom_node_asset_id
      - node_class
      - node_family
      - compatibility_status
    supports:
      - summary
      - graph_projection
  - kind: comfyui_workflow_batch
    display_name: "ComfyUI Workflow Batch"
    canonical_schema: capabilities.comfyui_runtime.schema.workflow_asset
    id_field: batch_id
    selector_families: [object_root, graph_node]
    indexer_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:sync_batch_index
    mention_fields:
      - batch_id
      - status
    summary_fields:
      - batch_id
      - status
      - workflow_refs
      - source_object_refs
    supports:
      - summary
      - detail
      - graph_projection
  - kind: comfyui_run_receipt
    display_name: "ComfyUI Run Receipt"
    canonical_schema: capabilities.comfyui_runtime.schema.workflow_asset
    id_field: run_receipt_id
    selector_families: [object_root, graph_node]
    indexer_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:sync_receipt_index
    mention_fields:
      - run_receipt_id
      - workflow_id
      - batch_id
      - status
    summary_fields:
      - run_receipt_id
      - workflow_id
      - batch_id
      - status
      - error_summary
    supports:
      - summary
      - detail
      - graph_projection

object_resolvers:
  - kind: comfyui_workflow
    summary_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:resolve_workflow_summary
    detail_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:resolve_workflow_detail
    actions_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:resolve_workflow_actions
  - kind: comfyui_model_asset
    summary_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:resolve_model_summary
  - kind: comfyui_custom_node_asset
    summary_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:resolve_custom_node_summary
  - kind: comfyui_workflow_batch
    summary_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:resolve_batch_summary
  - kind: comfyui_run_receipt
    summary_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:resolve_receipt_summary

meeting_projections:
  - kind: comfyui_workflow
    projection_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:project_workflow_for_meeting
    projection_schema: capabilities.comfyui_runtime.schema.workflow_asset
    verbs:
      - attach
      - preview
      - stage

graph_projections:
  - kind: comfyui_workflow
    backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:project_workflow_for_graph
    node_kind: comfyui_workflow
    relation_kinds:
      - depends_on_model
      - depends_on_custom_node
      - imported_from_source_pack
  - kind: comfyui_workflow_batch
    backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:project_batch_for_graph
    node_kind: comfyui_workflow_batch
    relation_kinds:
      - uses_source_object
      - contains_batch_item
      - included_in_batch
  - kind: comfyui_run_receipt
    backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:project_receipt_for_graph
    node_kind: comfyui_run_receipt
    relation_kinds:
      - produced_run_receipt
      - generated_output_artifact

affordances:
  - verb: dispatch_workflow_batch
    label: "Dispatch ComfyUI workflow batch"
    description: "Plan and dispatch a ComfyUI workflow batch from object refs."
    object_kinds:
      - comfyui_workflow
      - comfyui_workflow_batch
    input_schema:
      type: object
      required:
        - workflow_ref
      properties:
        workflow_ref:
          type: string
        source_object_refs:
          type: array
        batch_id:
          type: string
    output_schema:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        batch:
          type: object
        receipts:
          type: array
    required_roles:
      - source
      - target
    write_modes:
      - staged
      - owner_canonical_lane
    planner_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:plan_dispatch_workflow_batch
    executor_backend: capabilities.comfyui_runtime.services.object_layer.workflow_runtime:execute_dispatch_workflow_batch

composition_graph_nodes:
  enabled: true
  contract_version: "1.0.0"
  nodes:
    - id: comfyui_lane_adapter
      label: "ComfyUI Lane"
      category: generation
      input_ports:
        - id: reference_set
          direction: input
          data_type: ig_reference_set
          required: true
      output_ports:
        - id: run_receipt
          direction: output
          data_type: comfyui_run_receipt
      payload_schema:
        type: object
        required:
          - workflow_ref
        properties:
          workflow_ref:
            type: string
          target_runtime_profile:
            type: string
        additionalProperties: true
      executor:
        backend: capabilities.comfyui_runtime.services.graph_nodes.lane_adapter:run_comfyui_lane_adapter
      option_sources:
        workflow_ref:
          backend: capabilities.comfyui_runtime.services.graph_nodes.lane_adapter:list_comfyui_lane_options

# Tools
tools:
  - code: comfyui_import_workflow_asset
    name: comfyui_import_workflow_asset
    description: "Import a ComfyUI workflow asset as AOL metadata."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_import_workflow_asset

  - code: comfyui_sync_workflow_source_pack
    name: comfyui_sync_workflow_source_pack
    description: "Sync workflow templates from a source pack into ComfyUI workflow objects."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_sync_workflow_source_pack

  - code: comfyui_sync_model_assets
    name: comfyui_sync_model_assets
    description: "Sync model asset metadata from workflow requirements."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_sync_model_assets

  - code: comfyui_sync_custom_node_assets
    name: comfyui_sync_custom_node_assets
    description: "Sync custom node asset metadata from workflow requirements."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_sync_custom_node_assets

  - code: comfyui_plan_workflow_batch
    name: comfyui_plan_workflow_batch
    description: "Plan a ComfyUI workflow batch from workflow and source object refs."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_plan_workflow_batch

  - code: comfyui_execute_workflow_batch
    name: comfyui_execute_workflow_batch
    description: "Execute a pre-planned ComfyUI workflow batch."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_execute_workflow_batch

  - code: comfyui_dispatch_workflow_batch
    name: comfyui_dispatch_workflow_batch
    description: "Idempotently plan and execute a ComfyUI workflow batch."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_dispatch_workflow_batch

  - code: comfyui_get_run_receipt
    name: comfyui_get_run_receipt
    description: "Read a ComfyUI run receipt object."
    backend: capabilities.comfyui_runtime.tools.workflow_asset_tools:comfyui_get_run_receipt

  - code: comfyui_detect_platform
    name: comfyui_detect_platform
    description: "Detect GPU platform and recommend installation profile"
    backend: capabilities.comfyui_runtime.tools.detect_platform:detect_platform

  - code: comfyui_install
    name: comfyui_install
    description: "Install ComfyUI natively (git clone + venv) or via Docker"
    backend: capabilities.comfyui_runtime.tools.install:install_comfyui
    input_schema:
      type: object
      properties:
        install_path:
          type: string
          description: "Target directory for installation (default: ~/.mindscape/comfyui)"
        force_reinstall:
          type: boolean
          default: false

  - code: comfyui_start
    name: comfyui_start
    description: "Start ComfyUI server process and wait for readiness"
    backend: capabilities.comfyui_runtime.tools.start:start_comfyui
    input_schema:
      type: object
      properties:
        install_path:
          type: string
          description: "Path to ComfyUI installation directory"
          default: "~/.mindscape/comfyui"
        port:
          type: integer
          description: "Port to run ComfyUI on"
          default: 8188
        listen:
          type: string
          description: "Address to listen on"
          default: "127.0.0.1"
        timeout:
          type: integer
          description: "Seconds to wait for server health"
          default: 30

  - code: comfyui_download_models
    name: comfyui_download_models
    description: "Download models based on selected profile"
    backend: capabilities.comfyui_runtime.tools.download_models:download_models
    input_schema:
      type: object
      required: [profile_id]
      properties:
        profile_id:
          type: string
          enum: [vr_minimal, vr_preview_local, vr_face_bootstrap_local, vr_face_aux_facecard_local, vr_generative, vr_flux2_klein_true_v2_q6_local, vr_wan22_14b_kj, vr_liveportrait_hybrid_talking_head_preview, vr_liveportrait_hybrid_talking_head_quality, vr_regional_multi_subject_preview]
        models_dir:
          type: string
          description: "Target models directory"

  - code: comfyui_health_check
    name: comfyui_health_check
    description: "Validate ComfyUI server health and loaded models"
    backend: capabilities.comfyui_runtime.tools.health_check:health_check
    input_schema:
      type: object
      properties:
        comfyui_url:
          type: string
          default: "http://localhost:8188"

  - code: comfyui_register
    name: comfyui_register
    description: "Register ComfyUI URL in runtime configuration"
    backend: capabilities.comfyui_runtime.tools.register:register_comfyui
    input_schema:
      type: object
      required: [comfyui_url]
      properties:
        comfyui_url:
          type: string
        runtime_id:
          type: string
          description: "Optional runtime ID to update"

# Playbooks
playbooks:
  - code: comfyui_workflow_import
    display_name: "ComfyUI Workflow Import"
    display_name_zh: "ComfyUI Workflow 匯入"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_workflow_import.md
    spec_path: playbooks/specs/comfyui_workflow_import.json
    description: "Import a workflow into the ComfyUI AOL object layer."
    tool_dependencies:
      - comfyui_runtime.comfyui_import_workflow_asset

  - code: comfyui_workflow_source_pack_sync
    display_name: "ComfyUI Workflow Source Pack Sync"
    display_name_zh: "ComfyUI Workflow Source Pack 同步"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_workflow_source_pack_sync.md
    spec_path: playbooks/specs/comfyui_workflow_source_pack_sync.json
    description: "Sync workflow templates from video_renderer or motion_runtime."
    tool_dependencies:
      - comfyui_runtime.comfyui_sync_workflow_source_pack

  - code: comfyui_model_asset_sync
    display_name: "ComfyUI Model Asset Sync"
    display_name_zh: "ComfyUI Model Asset 同步"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_model_asset_sync.md
    spec_path: playbooks/specs/comfyui_model_asset_sync.json
    description: "Sync model assets required by ComfyUI workflows."
    tool_dependencies:
      - comfyui_runtime.comfyui_sync_model_assets

  - code: comfyui_custom_node_asset_sync
    display_name: "ComfyUI Custom Node Asset Sync"
    display_name_zh: "ComfyUI Custom Node Asset 同步"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_custom_node_asset_sync.md
    spec_path: playbooks/specs/comfyui_custom_node_asset_sync.json
    description: "Sync custom node assets required by ComfyUI workflows."
    tool_dependencies:
      - comfyui_runtime.comfyui_sync_custom_node_assets

  - code: comfyui_workflow_batch_plan
    display_name: "ComfyUI Workflow Batch Plan"
    display_name_zh: "ComfyUI Workflow Batch 規劃"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_workflow_batch_plan.md
    spec_path: playbooks/specs/comfyui_workflow_batch_plan.json
    description: "Plan a ComfyUI workflow batch from object refs."
    tool_dependencies:
      - comfyui_runtime.comfyui_plan_workflow_batch

  - code: comfyui_workflow_batch_execute
    display_name: "ComfyUI Workflow Batch Execute"
    display_name_zh: "ComfyUI Workflow Batch 執行"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_workflow_batch_execute.md
    spec_path: playbooks/specs/comfyui_workflow_batch_execute.json
    description: "Execute a planned ComfyUI workflow batch."
    tool_dependencies:
      - comfyui_runtime.comfyui_execute_workflow_batch

  - code: comfyui_workflow_batch_dispatch
    display_name: "ComfyUI Workflow Batch Dispatch"
    display_name_zh: "ComfyUI Workflow Batch 派工"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_workflow_batch_dispatch.md
    spec_path: playbooks/specs/comfyui_workflow_batch_dispatch.json
    description: "Idempotently plan and execute a ComfyUI workflow batch."
    tool_dependencies:
      - comfyui_runtime.comfyui_dispatch_workflow_batch

  - code: comfyui_workflow_smoke
    display_name: "ComfyUI Workflow Smoke"
    display_name_zh: "ComfyUI Workflow Smoke"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_workflow_smoke.md
    spec_path: playbooks/specs/comfyui_workflow_smoke.json
    description: "Smoke test ComfyUI workflow source sync and dispatch receipt creation."
    tool_dependencies:
      - comfyui_runtime.comfyui_sync_workflow_source_pack
      - comfyui_runtime.comfyui_dispatch_workflow_batch

  - code: comfyui_setup
    display_name: "ComfyUI Setup"
    display_name_zh: "ComfyUI 安裝設置"
    locales: [zh-TW, en]
    path: playbooks/{locale}/comfyui_setup.md
    spec_path: playbooks/specs/comfyui_setup.json
    description: "Install ComfyUI, download models, and register runtime"
    description_zh: "安裝 ComfyUI、下載模型並註冊執行環境"
    tool_dependencies:
      - comfyui_runtime.comfyui_detect_platform
      - comfyui_runtime.comfyui_install
      - comfyui_runtime.comfyui_start
      - comfyui_runtime.comfyui_download_models
      - comfyui_runtime.comfyui_health_check
      - comfyui_runtime.comfyui_register

# API Routes
apis:
  - code: comfyui_runtime
    path: api/__init__.py
    router_export: router
    prefix: /api/v1/capabilities/comfyui_runtime
    enabled_by_default: true

# UI Components
ui_components:
  - code: ComfyUIRuntimeSettingsPanel
    path: ui/components/ComfyUIRuntimeSettingsPanel.tsx
    display_name: "ComfyUI Local Runtime Settings"
    description: "Configure host-side ComfyUI install path and validate access"
    export: "default"
    settings:
      section: "runtime-environments"
      title: "ComfyUI Local Runtime"
      description: "Manage the host ComfyUI install path from the capability pack"
      order: 40
      requires_workspace_id: false
      display_mode: "runtime_modal"
      show_when:
        runtime_codes:
          - comfyui
          - comfyui_local
          - comfyui_runtime
  - code: ComfyUIRuntimePanel
    path: ui/components/ComfyUIRuntimePanel.tsx
    display_name: "ComfyUI Runtime"
    description: "Manage ComfyUI installation, models, and status"
    export: "default"
    settings:
      section: "workflow-engines"
      title: "ComfyUI Runtime"
      order: 50
      requires_workspace_id: false
      show_when:
        always: true

