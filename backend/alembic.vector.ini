# PostgreSQL vector-database migration configuration

[alembic]
script_location = %(here)s/alembic_migrations/vector
prepend_sys_path = .
version_locations = %(here)s/alembic_migrations/vector/versions
version_path_separator = os

# The vector URL is resolved exclusively by vector/env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
