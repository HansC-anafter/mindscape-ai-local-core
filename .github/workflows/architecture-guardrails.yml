name: Architecture Guardrails

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'web-console/**'
      - 'scripts/ci/**'
      - 'ci/**'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
  push:
    branches: [master, main]
    paths:
      - 'backend/app/**'
      - 'backend/tests/**'
      - 'web-console/**'
      - 'scripts/ci/**'
      - 'ci/**'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml pytest

      - name: Compute diff range
        id: diff
        shell: bash
        run: |
          BASE_SHA=""
          HEAD_SHA="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"

      - name: Validate modular entrypoints (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/ci/validate_modular_entrypoints.py \
            --event-name pull_request \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}" \
            --policy ci/modular_entry_guardrails.yaml \
            --pr-body-file "$RUNNER_TEMP/pr_body.md"

      - name: Validate modular entrypoints (push)
        if: github.event_name == 'push'
        run: |
          python scripts/ci/validate_modular_entrypoints.py \
            --event-name push \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}" \
            --policy ci/modular_entry_guardrails.yaml

      - name: Run guardrail tests
        run: |
          cd backend
          python -m pytest \
            tests/ci/validate_modular_entrypoints_guard_spec.py \
            tests/ci/pr_template_modular_entry_section_spec.py -q
