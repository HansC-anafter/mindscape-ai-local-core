name: Architecture Guardrails

on:
  pull_request:
    paths:
      - 'backend/app/**'
      - 'backend/features/**'
      - 'backend/scripts/**'
      - 'backend/features/workspace/executions_core/progress_snapshot.py'
      - 'backend/scripts/preflight_db.py'
      - 'backend/alembic.vector.ini'
      - 'backend/alembic_migrations/versions/**'
      - 'backend/alembic_migrations/postgres/versions/**'
      - 'backend/alembic_migrations/postgres/*.py'
      - 'backend/alembic_migrations/vector/**'
      - 'backend/packs/**'
      - 'backend/tests/**'
      - 'device-node/**'
      - 'mcp-mindscape-gateway/**'
      - 'web-console/**'
      - 'scripts/ci/**'
      - 'scripts/start.*'
      - 'scripts/compose.*'
      - 'scripts/runtime_secrets/**'
      - 'scripts/maintenance/runtime_pressure_gate.py'
      - 'scripts/maintenance/runtime_pressure_gate_core/**'
      - 'schemas/manifest.schema.yaml'
      - 'scripts/maintenance/check_runtime_read_path_budget.py'
      - 'scripts/maintenance/postgres_incident_gate.py'
      - 'scripts/maintenance/postgres_signal_observer.py'
      - 'scripts/maintenance/postgres_signal_observer_drill.py'
      - 'scripts/maintenance/postgres_signal_observer_core/**'
      - 'scripts/maintenance/postgres_signal_observer_preflight.py'
      - 'scripts/maintenance/postgres_signal_observer_preflight_core/**'
      - 'scripts/maintenance/postgres_recovery_drill.py'
      - 'scripts/postgres_recovery_drill_core/**'
      - 'scripts/start_remote_workbench_tunnel.sh'
      - 'scripts/remote_workbench_remote_ingress_lock.py'
      - 'scripts/verify_remote_workbench_identity_workspace_authorization.py'
      - 'scripts/remote_workbench_authorization_cutover/**'
      - 'scripts/remote_workbench_bridge_monitor.py'
      - 'scripts/remote_workbench_bridge/**'
      - 'scripts/install-remote-workbench-bridge-macos.sh'
      - 'scripts/config/ai.mindscape.remote-workbench-bridge.plist'
      - 'scripts/rtmp_motion_window_publisher.py'
      - 'scripts/rtmp_motion_publisher/**'
      - 'ci/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'config/service-endpoints.seed.json'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'
  push:
    branches: [master, main]
    paths:
      - 'backend/app/**'
      - 'backend/features/**'
      - 'backend/scripts/**'
      - 'backend/features/workspace/executions_core/progress_snapshot.py'
      - 'backend/scripts/preflight_db.py'
      - 'backend/alembic.vector.ini'
      - 'backend/alembic_migrations/versions/**'
      - 'backend/alembic_migrations/postgres/versions/**'
      - 'backend/alembic_migrations/postgres/*.py'
      - 'backend/alembic_migrations/vector/**'
      - 'backend/packs/**'
      - 'backend/tests/**'
      - 'device-node/**'
      - 'mcp-mindscape-gateway/**'
      - 'web-console/**'
      - 'scripts/ci/**'
      - 'scripts/start.*'
      - 'scripts/compose.*'
      - 'scripts/runtime_secrets/**'
      - 'scripts/maintenance/runtime_pressure_gate.py'
      - 'scripts/maintenance/runtime_pressure_gate_core/**'
      - 'schemas/manifest.schema.yaml'
      - 'scripts/maintenance/check_runtime_read_path_budget.py'
      - 'scripts/maintenance/postgres_incident_gate.py'
      - 'scripts/maintenance/postgres_signal_observer.py'
      - 'scripts/maintenance/postgres_signal_observer_drill.py'
      - 'scripts/maintenance/postgres_signal_observer_core/**'
      - 'scripts/maintenance/postgres_signal_observer_preflight.py'
      - 'scripts/maintenance/postgres_signal_observer_preflight_core/**'
      - 'scripts/maintenance/postgres_recovery_drill.py'
      - 'scripts/postgres_recovery_drill_core/**'
      - 'scripts/start_remote_workbench_tunnel.sh'
      - 'scripts/remote_workbench_remote_ingress_lock.py'
      - 'scripts/verify_remote_workbench_identity_workspace_authorization.py'
      - 'scripts/remote_workbench_authorization_cutover/**'
      - 'scripts/remote_workbench_bridge_monitor.py'
      - 'scripts/remote_workbench_bridge/**'
      - 'scripts/install-remote-workbench-bridge-macos.sh'
      - 'scripts/config/ai.mindscape.remote-workbench-bridge.plist'
      - 'scripts/rtmp_motion_window_publisher.py'
      - 'scripts/rtmp_motion_publisher/**'
      - 'ci/**'
      - 'docker-compose.yml'
      - 'docker/**'
      - 'Dockerfile.backend'
      - 'Dockerfile.frontend'
      - 'config/service-endpoints.seed.json'
      - '.github/workflows/**'
      - '.github/CODEOWNERS'
      - '.github/pull_request_template.md'

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout product semantic contract source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/mindscape-ai-cloud
          token: ${{ secrets.MINDSCAPE_CI_REPO_READ_TOKEN || github.token }}
          path: .contract-sources/mindscape-ai-cloud
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyyaml pytest

      - name: Validate product semantic helper parity
        run: |
          python scripts/ci/validate_product_semantic_helper_parity.py

      - name: Validate Compose topology
        run: |
          python scripts/ci/validate_compose_topology.py --repo-root .

      - name: Compute diff range
        id: diff
        shell: bash
        run: |
          BASE_SHA=""
          HEAD_SHA="${GITHUB_SHA}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Write PR body
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr_body.md"

      - name: Validate modular entrypoints (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/ci/validate_modular_entrypoints.py \
            --event-name pull_request \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}" \
            --policy ci/modular_entry_guardrails.yaml \
            --pr-body-file "$RUNNER_TEMP/pr_body.md"

      - name: Validate modular entrypoints (push)
        if: github.event_name == 'push'
        run: |
          python scripts/ci/validate_modular_entrypoints.py \
            --event-name push \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}" \
            --policy ci/modular_entry_guardrails.yaml

      - name: Validate product semantics (pull request)
        if: github.event_name == 'pull_request'
        run: |
          python scripts/ci/validate_product_semantics.py \
            --event-name pull_request \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}" \
            --registry ci/product_semantic_surfaces.yaml \
            --contract-root .contract-sources/mindscape-ai-cloud \
            --pr-body-file "$RUNNER_TEMP/pr_body.md"

      - name: Validate product semantics (push)
        if: github.event_name == 'push'
        run: |
          python scripts/ci/validate_product_semantics.py \
            --event-name push \
            --base-sha "${{ steps.diff.outputs.base_sha }}" \
            --head-sha "${{ steps.diff.outputs.head_sha }}" \
            --registry ci/product_semantic_surfaces.yaml \
            --contract-root .contract-sources/mindscape-ai-cloud

      - name: Run guardrail tests
        run: |
          cd backend
          python -m pytest \
            tests/ci/validate_modular_entrypoints_guard_spec.py \
            tests/ci/product_semantic_helper_parity_spec.py \
            tests/ci/validate_product_semantics_guard_spec.py \
            tests/ci/product_semantic_contract_source_spec.py \
            tests/ci/pr_template_modular_entry_section_spec.py \
            tests/ci/local_core_push_verification_contract_spec.py -q
