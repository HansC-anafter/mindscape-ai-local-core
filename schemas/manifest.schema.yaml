# Manifest Schema for Capability Packs
#
# Defines the structure requirements for capability pack manifest.yaml files.
# Includes required portability and environment compatibility declarations.
#
# Validation:
#   python scripts/ci/validate_manifest.py capabilities/

$schema: "http://json-schema.org/draft-07/schema#"
title: Capability Pack Manifest
description: |
  Manifest schema for Mindscape capability packs.
  Includes portability requirements for cross-environment deployment.
type: object
required:
  - code
  - version
  - portability # Required

properties:
  # ============================================================================
  # Basic information
  # ============================================================================

  code:
    type: string
    pattern: "^[a-z0-9_]+$"
    description: "Unique capability identifier (lowercase, underscores allowed)"
    examples:
      - example_capability
      - data_processor
      - content_analyzer

  version:
    type: string
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    description: "Semantic version number (semver)"
    examples:
      - "1.0.0"
      - "2.1.3"

  display_name:
    type: string
    description: "Display name"
    examples:
      - "Example Capability"
      - "Data Processor"

  description:
    type: string
    description: "Capability description"

  type:
    type: string
    enum:
      [
        feature,
        core,
        extension,
        connector,
        system,
        agent,
        infrastructure,
        system_runtime,
      ]
    default: feature
    description: |
      Capability type:
      - feature: feature capability pack
      - core: core capability required by the system
      - extension: extension capability
      - connector: external service connector
      - system: system-level capability
      - agent: AI agent capability
      - infrastructure: infrastructure capability
      - system_runtime: system runtime capability

  aol_maturity:
    type: string
    enum: [AOL-0, AOL-1, AOL-2, AOL-3, AOL-4, AOL-5]
    description: "Addressable Object Layer maturity claim for this pack"

  contract_exports:
    type: array
    description: "Contracts exported by this capability pack"
    items:
      type: object
      required:
        - contract_id
        - module
        - version
      properties:
        contract_id:
          type: string
          pattern: "^[a-z0-9_]+$"
        module:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+\\.schema(?:\\.[A-Za-z0-9_]+)+$"
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:[-+][A-Za-z0-9_.-]+)?$"
        legacy_aliases:
          type: array
          items:
            type: string
            pattern: "^(shared|backend\\.shared)\\.schemas\\.[A-Za-z0-9_]+$"

  contract_imports:
    type: array
    description: "Contracts this capability expects another pack to provide"
    items:
      type: object
      required:
        - contract_id
        - provider_pack
        - version_range
      properties:
        contract_id:
          type: string
          pattern: "^[a-z0-9_]+$"
        provider_pack:
          type: string
          pattern: "^[a-z0-9_]+$"
        version_range:
          type: string
          pattern: "^[\\^~<>=!, 0-9A-Za-z_.-]+$"

  meeting_artifact_producers:
    type: array
    description: "Meeting TaskIR artifact producers exposed by this capability pack"
    items:
      type: object
      required:
        - mime_type
        - backend
        - input_contract
      properties:
        mime_type:
          type: string
          pattern: "^[A-Za-z0-9!#$&^_.+-]+/[A-Za-z0-9!#$&^_.+-]+(?:\\+[A-Za-z0-9!#$&^_.+-]+)?$"
        backend:
          type: string
          pattern: "^capabilities\\.[a-z0-9_]+\\.[A-Za-z0-9_\\.]+:[A-Za-z_][A-Za-z0-9_]*$"
        governance_request_key:
          type: string
          pattern: "^[a-z0-9_]+$"
        input_contract:
          type: string
          pattern: "^[a-z0-9_]+$"
        description:
          type: string

  # ============================================================================
  # Portability declaration (required)
  # ============================================================================

  portability:
    type: object
    required:
      - min_local_core_version
      - environments
    description: "Portability declaration defining cross-environment deployment support"
    properties:
      min_local_core_version:
        type: string
        pattern: "^\\d+\\.\\d+\\.\\d+$"
        description: "Minimum supported Local-Core version"
        examples:
          - "0.9.0"
          - "1.0.0"

      environments:
        type: array
        items:
          type: string
          enum: [cloud, local-core]
        minItems: 1
        description: |
          Supported environment list.
          Must include "local-core" to pass validation.
        examples:
          - [cloud, local-core]
          - [local-core]

      degradation_strategy:
        type: string
        enum: [fail-fast, graceful]
        default: graceful
        description: |
          Strategy when dependencies are unavailable:
          - fail-fast: fail immediately
          - graceful: run with degraded functionality

  # ============================================================================
  # Dependency declaration
  # ============================================================================

  dependencies:
    oneOf:
      - type: object
        description: "Dependency declaration (recommended format)"
        properties:
          required:
            type: array
            items:
              type: string
            description: "Required dependencies; capability cannot start when missing"
            examples:
              - [core_llm]
              - [core_llm, database]

          optional:
            type: array
            items:
              oneOf:
                - type: string
                - type: object
                  anyOf:
                    - required: [name]
                    - required: [code]
                  properties:
                    name:
                      type: string
                      description: "Dependency name"
                    code:
                      type: string
                      description: "Dependency name (compatible alias)"
                    fallback:
                      type: [string, "null"]
                      description: "Fallback module path; null means no fallback"
                    degraded_features:
                      type: array
                      items:
                        type: string
                      description: "Features degraded when this dependency is missing"
            description: |
              Optional dependencies. Capability can start when these are missing,
              but some features may be unavailable. Use object format to declare
              fallback and degraded_features.
            examples:
              - name: contracts.execution_context
                fallback: mindscape.shims.execution_context
                degraded_features:
                  - pipeline_orchestration
                  - async_job_dispatch

          external_services:
            type: array
            items:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  description: "External service name"
                env_var:
                  type: string
                  description: "Environment variable required to configure this service"
                degraded_features:
                  type: array
                  items:
                    type: string
                  description: "Features degraded when this service is missing"
            description: "External service dependencies requiring API keys or equivalent configuration"
            examples:
              - name: gcs_storage
                env_var: GCS_CREDENTIALS
                degraded_features:
                  - video_upload
                  - asset_storage
      - type: array
        description: "Dependency declaration (legacy format; accepted but object format is recommended)"
        items:
          type: string

  # ============================================================================
  # Playbook definitions
  # ============================================================================

  playbooks:
    type: array
    description: "Playbook list"
    items:
      type: object
      required:
        - code
        - locales
        - path
        - spec_path
      properties:
        code:
          type: string
          pattern: "^[a-z0-9_]+$"
          description: "Playbook code"
        display_name:
          type: string
          description: "Display name"
        display_name_zh:
          type: string
          description: "Chinese display name"
        locales:
          type: array
          items:
            type: string
          minItems: 1
          description: "Supported locales"
          examples:
            - [zh-TW, en]
        path:
          type: string
          pattern: "^playbooks/\\{locale\\}/.*\\.md$"
          description: "Playbook markdown file path template"
        spec_path:
          type: string
          pattern: "^playbooks/specs/.*\\.(json|yaml)$"
          description: "Playbook spec file path"
        description:
          type: string
        description_zh:
          type: string
        tool_dependencies:
          type: array
          items:
            type: string
          description: "Tools required by this playbook"
        service_dependencies:
          type: array
          items:
            type: string
          description: "Services required by this playbook"
        variants:
          type: array
          description: "Playbook variant definitions for skipped steps, custom checklists, and execution parameter overrides"
          items:
            type: object
            required:
              - variant_id
              - name
            properties:
              variant_id:
                type: string
                pattern: "^[a-z0-9_]+$"
                description: "Unique variant identifier"
              name:
                type: string
                description: "Variant display name"
              description:
                type: string
              skip_steps:
                type: array
                items:
                  type: integer
                description: "Step indexes to skip"
              custom_checklist:
                type: array
                items:
                  type: string
                description: "Custom checklist items"
              execution_params:
                type: object
                description: "Execution parameter overrides"
              conditions:
                type: object
                description: "Automatic selection conditions (for example risk_level or locale)"

        consumes:
          type: array
          description: "Input data types required by this playbook"
          items:
            oneOf:
              - type: string
                description: "Backward-compatible bare string format (for example ig_following_profiles)"
              - type: object
                required: [type]
                properties:
                  type:
                    type: string
                    description: "Data type identifier"
                  label:
                    type: string
                    description: "Display label"

        produces:
          type: array
          description: "Data types produced by this playbook"
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                description: "Data type identifier"
              label:
                type: string
                description: "Display label"
              storage:
                type: string
                enum: [file, db, api]
                description: "Storage backend"

  # ============================================================================
  # Addressable Object Layer declaration
  # ============================================================================

  object_exports:
    type: array
    description: "Addressable object kinds owned by this capability pack"
    items:
      type: object
      required:
        - kind
        - display_name
        - id_field
      properties:
        kind:
          type: string
          pattern: "^[a-z0-9_]+$"
        display_name:
          type: string
        canonical_schema:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+\\.schema(?:\\.[A-Za-z0-9_]+)+$"
        id_field:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        summary_fields:
          type: array
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        supports:
          type: array
          items:
            type: string
            enum:
              - summary
              - detail
              - relations
              - actions
              - meeting_projection
              - materialize
              - graph_projection
        granularity:
          type: string
          pattern: "^[a-z0-9_]+$"
        selector_families:
          type: array
          items:
            type: string
            enum:
              - object_root
              - dom_anchor
              - image_region
              - media_time_range
              - storyboard_scene
              - storyboard_slot
              - timeline_clip
              - pack_local_path
              - graph_node
        indexer_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        mention_fields:
          type: array
          items:
            type: string
            pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        owner_surface_patterns:
          type: array
          items:
            type: string

  object_resolvers:
    type: array
    description: "Resolver hooks for declared addressable object kinds"
    items:
      type: object
      required:
        - kind
        - summary_backend
      properties:
        kind:
          type: string
          pattern: "^[a-z0-9_]+$"
        summary_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        detail_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        relations_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        actions_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        availability:
          oneOf:
            - type: string
            - type: object

  meeting_projections:
    type: array
    description: "Meeting-safe projection hooks for addressable objects"
    items:
      type: object
      required:
        - kind
        - projection_backend
        - verbs
      properties:
        kind:
          type: string
          pattern: "^[a-z0-9_]+$"
        projection_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        projection_schema:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+\\.schema(?:\\.[A-Za-z0-9_]+)+$"
        verbs:
          type: array
          items:
            type: string
            enum:
              - attach
              - recommend
              - expand
              - preview
              - stage
              - review
              - promote

  materializers:
    type: array
    description: "Pack-owned materialization hooks for meeting outcomes"
    items:
      type: object
      required:
        - kind
        - verbs
        - backend
        - output_types
        - write_mode
      properties:
        kind:
          type: string
          pattern: "^[a-z0-9_]+$"
        verbs:
          type: array
          items:
            type: string
            enum:
              - attach
              - recommend
              - expand
              - preview
              - stage
              - review
              - promote
        backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        output_types:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9_]+$"
        write_mode:
          type: string
          enum:
            - proposal_only
            - staged
            - canonical_with_review
            - owner_canonical_lane
            - recommendation_only

  graph_projections:
    type: array
    description: "Optional graph projection hooks for addressable objects"
    items:
      type: object
      required:
        - kind
        - backend
      properties:
        kind:
          type: string
          pattern: "^[a-z0-9_]+$"
        backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        node_kind:
          type: string
          pattern: "^[a-z0-9_]+$"
        relation_kinds:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9_]+$"

  affordances:
    type: array
    description: "Schema-backed callable object affordances"
    items:
      type: object
      required:
        - verb
        - input_schema
        - output_schema
        - required_roles
        - write_modes
        - planner_backend
      properties:
        verb:
          type: string
          pattern: "^[a-z0-9_]+$"
        description:
          type: string
        object_kinds:
          type: array
          items:
            type: string
            pattern: "^[a-z0-9_]+$"
        input_schema:
          type: object
        output_schema:
          type: object
        required_roles:
          type: array
          items:
            type: string
            enum:
              - source
              - target
              - character
              - constraint
              - output
              - meeting
              - session
              - node
        write_modes:
          type: array
          items:
            type: string
            enum:
              - proposal_only
              - staged
              - canonical_with_review
              - owner_canonical_lane
              - recommendation_only
        planner_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
        executor_backend:
          type: string
          pattern: "^(app\\.)?capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"

  # ============================================================================
  # Tool definitions
  # ============================================================================

  tools:
    type: array
    description: "Tool list"
    items:
      type: object
      required:
        - name
        - backend
      properties:
        name:
          type: string
          pattern: "^[a-z0-9_]+$"
          description: "Tool name"
        code:
          type: string
          description: "Tool code (optional; defaults to name)"
        backend:
          type: string
          # Requirement: use capabilities.* format; mindscape.capabilities.* is deprecated.
          pattern: "^capabilities\\.[a-z0-9_]+\\.[a-z0-9_.]+:[a-z0-9_]+$"
          description: |
            Backend import path.
            Must use capabilities.* format; mindscape.capabilities.* is deprecated.
            Format: capabilities.{capability}.{module}:{function}
          examples:
            - "capabilities.example_capability.tools.data_processor:process_data"
        description:
          type: string
        schema_path:
          type: string
          pattern: "^tools/schemas/.*\\.(json|yaml)$"
          description: |
            External file path for input_schema (relative to pack root).
            When specified, the schema file is loaded at runtime and
            injected as input_schema.  Mutually exclusive with inline
            input_schema (schema_path takes lower priority).
        input_schema:
          type: object
          description: "Tool input schema (JSON Schema)"
        used_by_playbooks:
          type: array
          items:
            type: string
          description: "Playbooks that use this tool"

  # ============================================================================
  # Service definitions
  # ============================================================================

  services:
    type: array
    description: "Service list"
    items:
      type: object
      required:
        - name
        - backend
      properties:
        name:
          type: string
          description: "Service name"
        path:
          type: string
          description: "Service file path"
        backend:
          type: string
          pattern: "^(mindscape\\.)?capabilities\\.[a-z0-9_]+\\.[a-z0-9_.]+:[A-Z][a-zA-Z0-9_]*$"
          description: "Backend import path"
        description:
          type: string

  # ============================================================================
  # Host resource lane declarations
  # ============================================================================

  host_resource_lanes:
    type: object
    description: "Neutral host resource lane declarations exposed by this capability pack."
    additionalProperties:
      type: object
      properties:
        label:
          type: string
        kind:
          type: string
        requirements:
          type: object
          properties:
            memory_mb:
              type: integer
              minimum: 0
            memory_source:
              type: string
            cpu_weight:
              type: integer
              minimum: 0
            exclusive_groups:
              type: array
              items:
                type: string
            confidence:
              type: string
            declaration_basis:
              type: object

  # ============================================================================
  # API definitions
  # ============================================================================

  apis:
    type: array
    description: "API endpoint definitions"
    items:
      type: object
      required:
        - path
        - prefix
      anyOf:
        - required: [code]
        - required: [name]
      properties:
        code:
          type: string
          description: "API code"
        name:
          type: string
          description: "API code (compatible alias)"
        path:
          type: string
          # Requirement: path must be under the api/ directory.
          pattern: "^api/.*\\.py$"
          description: |
            API entry file path.
            Must use the api/ directory.
          examples:
            - "api/__init__.py"
            - "api/main.py"
        router_export:
          type: string
          enum: [router, get_router]
          default: router
          description: |
            Router export mode:
            - router: export the router variable directly
            - get_router: export a get_router() function
        prefix:
          type: string
          pattern: "^/[a-z0-9_/-]+$"
          description: "API route prefix"
        enabled_by_default:
          type: boolean
          default: true
          description: "Whether this API is enabled by default"

  # Backward compatibility: capabilities field (deprecated)
  capabilities:
    type: array
    description: "API endpoint definitions (legacy field name; apis is recommended)"
    items:
      type: object
      required:
        - path
        - prefix
      anyOf:
        - required: [code]
        - required: [name]
      properties:
        code:
          type: string
          description: "API code"
        name:
          type: string
          description: "API code (compatible alias)"
        path:
          type: string
          pattern: "^api/.*\\.py$"
          description: |
            API entry file path.
            Must use the api/ directory.
          examples:
            - "api/__init__.py"
            - "api/main.py"
        router_export:
          type: string
          enum: [router, get_router]
          default: router
          description: |
            Router export mode:
            - router: export the router variable directly
            - get_router: export a get_router() function
        prefix:
          type: string
          pattern: "^/[a-z0-9_/-]+$"
          description: "API route prefix"
        enabled_by_default:
          type: boolean
          default: true
          description: "Whether this API is enabled by default"

  # ============================================================================
  # UI components
  # ============================================================================

  ui_components:
    type: array
    description: "Frontend UI component list"
    items:
      type: object
      required:
        - code
        - path
      properties:
        code:
          type: string
          description: "Component code"
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        path:
          type: string
          pattern: "^ui(?:/[A-Za-z0-9_.-]+)+\\.(tsx|ts|jsx|js)$"
          description: "Component file path"
        name:
          type: string
        display_name:
          type: string
        export:
          type: string
        description:
          type: string
        layout_hint:
          type: string
          enum: [default, scrollable_full_bleed]
          description: "Workspace host layout hint for this component"
        type:
          type: string
          enum: [capability_page, full_page, settings_panel]
        route:
          type: string
          pattern: "^/[A-Za-z0-9_./{}-]*$"
        artifact_types:
          type: array
          items:
            type: string
        playbook_codes:
          type: array
          items:
            type: string
        props_schema:
          type: object
          description: "Component props schema"
        settings:
          type: object
          required: [section]
          properties:
            section:
              type: string
              minLength: 1
            title:
              type: string
            description:
              type: string
            order:
              type: integer
            requires_workspace_id:
              type: boolean
            display_mode:
              type: string
            show_when:
              type: object
              properties:
                always:
                  type: boolean
                runtime_codes:
                  type: array
                  items:
                    type: string
                service_codes:
                  type: array
                  items:
                    type: string
              additionalProperties: false
            props_schema:
              type: object
          additionalProperties: false
      additionalProperties: false

  workspace_tools:
    type: array
    description: "Workspace rail tools declared by this capability pack"
    items:
      type: object
      required:
        - id
        - group
        - label
        - icon
        - panel_component_code
        - order
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_]+$"
        group:
          type: string
          enum: [capability]
        label:
          type: string
          minLength: 1
        icon:
          type: string
          minLength: 1
        panel_component_code:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
        order:
          type: integer
      additionalProperties: false

  composition_graph:
    type: object
    description: "Pack-owned node contract for the generic local-core composition graph runtime"
    required:
      - enabled
      - contract_version
      - node_types
      - edge_types
      - compile
    properties:
      enabled:
        type: boolean
      label:
        type: string
        minLength: 1
      contract_version:
        type: string
        pattern: "^[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:[-+][A-Za-z0-9_.-]+)?$"
      accepted_object_roles:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9_]+$"
      node_types:
        type: array
        items:
          type: object
          required:
            - id
            - label
            - input_ports
            - output_ports
          properties:
            id:
              type: string
              pattern: "^[a-z0-9_]+$"
              not:
                const: object_reference
            label:
              type: string
              minLength: 1
            description:
              type: string
            category:
              type: string
            input_ports:
              type: array
              items:
                $ref: "#/$defs/compositionGraphPort"
            output_ports:
              type: array
              items:
                $ref: "#/$defs/compositionGraphPort"
            payload_schema:
              type: object
            metadata:
              type: object
          additionalProperties: false
      edge_types:
        type: array
        items:
          type: object
          required:
            - id
            - label
          properties:
            id:
              type: string
              pattern: "^[a-z0-9_]+$"
            label:
              type: string
              minLength: 1
            source_data_type:
              type: string
              minLength: 1
            target_data_type:
              type: string
              minLength: 1
            metadata:
              type: object
          additionalProperties: false
      compile:
        type: object
        required:
          - backend
          - output_mode
        properties:
          backend:
            type: string
            pattern: "^capabilities\\.[a-z0-9_]+(?:\\.[A-Za-z0-9_]+)+:[A-Za-z_][A-Za-z0-9_]*$"
          output_mode:
            type: string
            enum: [meeting_command_envelope]
        additionalProperties: false
      metadata:
        type: object
    additionalProperties: false

  # ============================================================================
  # Model routing registration
  # ============================================================================

  model_routing:
    type: object
    description: "Explicitly declares model/runtime routing slots for centralized Settings registration"
    properties:
      slots:
        type: array
        items:
          type: object
          required:
            - kind
            - title
            - summary
          properties:
            slot_id:
              type: string
            kind:
              type: string
            title:
              type: string
            summary:
              type: string
            route_family:
              type: string
            settings_anchor:
              type: string
            value: {}
            metadata:
              type: object

  # ============================================================================
  # Data boundary
  # ============================================================================

  data_locality_default:
    type: object
    description: "Default data boundary declaration"
    properties:
      local_only:
        type: array
        items:
          type: string
        description: "Data types that can only be processed locally"
        examples:
          - raw_data_files
          - user_private_data
      cloud_allowed:
        type: array
        items:
          type: string
        description: "Data types that can be sent to Cloud for processing"
        examples:
          - processed_data
          - analysis_results

  # ============================================================================
  # Runtime configuration
  # ============================================================================

  runtime_affinity:
    type: string
    enum: [local, semantic, hybrid]
    default: semantic
    description: |
      Runtime affinity:
      - local: local execution only
      - semantic: Cloud execution only
      - hybrid: hybrid execution

  max_expected_runtime_sec:
    type: number
    minimum: 0
    description: "Expected maximum runtime in seconds"

  token_estimate:
    type: number
    minimum: 0
    description: "Estimated token usage"

  # ============================================================================
  # Bootstrap scripts
  # ============================================================================

  bootstrap:
    type: array
    description: "Bootstrap scripts executed after installation"
    items:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum: [python_script, content_vault_init, shell_script]
        path:
          type: string
          description: "Script path"
        vault_path:
          type: string
          description: "Content Vault path (content_vault_init only)"

$defs:
  compositionGraphPort:
    type: object
    required:
      - id
      - direction
      - data_type
    properties:
      id:
        type: string
        pattern: "^[a-z0-9_]+$"
      direction:
        type: string
        enum: [input, output]
      label:
        type: string
      data_type:
        type: string
        minLength: 1
      required:
        type: boolean
      accepted_object_roles:
        type: array
        items:
          type: string
          pattern: "^[a-z0-9_]+$"
      metadata:
        type: object
    additionalProperties: false

# ============================================================================
# Examples
# ============================================================================

examples:
  - code: example_capability
    version: "1.0.0"
    display_name: "Example Capability"
    type: feature
    description: "An example capability demonstrating the manifest structure"

    portability:
      min_local_core_version: "0.9.0"
      environments:
        - cloud
        - local-core
      degradation_strategy: graceful

    dependencies:
      required:
        - core_llm
      optional:
        - name: contracts.execution_context
          fallback: mindscape.shims.execution_context
          degraded_features:
            - pipeline_orchestration
      external_services:
        - name: external_storage
          env_var: STORAGE_CREDENTIALS
          degraded_features:
            - file_upload

    playbooks:
      - code: example_playbook
        locales: [zh-TW, en]
        path: playbooks/{locale}/example_playbook.md
        spec_path: playbooks/specs/example_playbook.json

    tools:
      - name: data_processor
        backend: "capabilities.example_capability.tools.data_processor:process_data"

    apis:
      - code: example_capability
        path: api/__init__.py
        router_export: router
        prefix: /example_capability
        enabled_by_default: true
