  - id: psc.local-core.workspace-group-dispatch-and-knowledge-projection.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/workspace-group-dispatch-and-knowledge-projection-contract-2026-07-15.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Workspace group definitions and normalized memberships are the only durable topology authority; legacy role maps are computed read projections and a workspace is never assigned to an arbitrary first group.
      - Group execution requires an explicitly authorized active group and an immutable topology revision snapshot; no active group preserves the existing single-workspace path.
      - The existing dispatch DAG remains the only execution scheduler, preserves the full eligible agent and workspace set, and hands results to exactly one canonical synthesis committer.
      - Shared group memory derives from canonical MemoryItem, MemoryVersion, evidence, governance, and receipts; cross-pack retrievable chunks, typed records, entity and evidence graph, visibility-partitioned community reports, and knowledge_query delegate psc.local-core.retrievable-knowledge-projection-and-agentic-query.v1, while human authorization delegates psc.local-core.authorization-aware-knowledge-retrieval.v1 and agent-scoped views may only narrow that set; Markdown is a rebuildable projection or source asset, never shared-memory truth.
      - Source intake separates owner-controlled fetch, immutable evidence, candidate memory, verified memory, and deterministic projections without adding a second credential store, database, scheduler, queue lane, or worker pool.
      - Group list, snapshot, projection, and UI reads stay bounded, avoid N-plus-one queries, preserve PgBouncer and runner capacity, and add no topology or projection polling loop.
      - Capability adapters consume the authorized host workspace-group contract and reach installed runtime only through the canonical capability-pack control-plane job and activation path.
    path_globs:
      - backend/app/models/workspace_group.py
      - backend/app/models/workspace/core.py
      - backend/app/models/workspace_resource_binding.py
      - backend/app/models/meeting_session.py
