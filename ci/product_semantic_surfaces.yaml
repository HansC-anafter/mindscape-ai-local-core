  - id: psc.local-core.remote-workbench-identity-workspace-enforcement.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/remote-workbench-identity-workspace-authorization-contract-2026-07-13.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Remote HTTP and WebSocket requests use one asynchronous gateway path that verifies the exact public Host and Cloudflare Access assertion before any workspace policy read.
      - Frontend startup reads exact issuer, single audience, source, revision, state, and canonical administrator set once from the pack-owned runtime policy; missing, default-deny-with-grants, or malformed config keeps the remote listener closed.
      - Verified issuer and subject must be an active Local Core super administrator or direct route-workspace member; capability routes independently require workspace allowlist, manifest request-scope contract, canonical host route, and owned API prefixes.
      - Data routes own an exact workspace_id in their URL; email, URL, Referer, token workspace claim, Host aliases, client ingress markers, and local resource administrators cannot grant membership.
      - Installed capability list is GET-only and projected by effective workspace allowlist intersected with embedded supported metadata; HEAD, OPTIONS, malformed, missing-support, oversized, or duplicate payloads fail closed without upstream bypass.
      - Remote workspace root and capability surfaces mount bounded data-only UI without local Header, Settings, Graph, full WorkspaceDataProvider, Link prefetch, timer polling, or hidden background requests.
      - Public settings documents, descendants, policy APIs, and settings descriptor queries fail with the control-plane 404 before any workspace policy resolver read.
      - Public tunnel traffic reaches only the compose-internal remote listener; every host-published HTTP, preview, PostgreSQL, PgBouncer, Redis, OCR, media, XTTS, and Whisper port is loopback-only.
      - Authorization adds no worker, runner, queue key, DB audit, PgBouncer capacity, N-workspace fan-out, retry loop, or UX polling; caches, payloads, concurrency, latency, and file-backed observability are bounded.
      - Enrollment, enforcement, install, restore, policy write, origin reconcile, claim pause, and backout use the one receipt-safe cutover runner; succeeded reruns perform zero POST and indeterminate state remains closed.
      - Core Settings is the only global administrator writer; Workspace Settings exposes one cold read-only effective-membership projection, while Pack Remote access remains the only workspace capability-code writer.
      - Global and workspace settings use separate installed-pack sections, and workspace hosts exclude global descriptors so no second policy editor or hidden policy read is mounted.
      - Policy control routes reuse host authentication through the audit-only local-core-control-plane actor without default-user or workspace reads; it grants no membership or resource role and preserves the one-statement effective-policy read budget.
    path_globs:
      - backend/app/dependencies/auth.py
      - backend/app/routes/core/capability_packs_core/installed_routes.py
      - backend/app/routes/core/capability_packs_core/mobile_workbench_gateway_support.py
      - backend/app/routes/core/settings_extensions.py
      - backend/app/services/host_resources/runner_claim_gate_bootstrap.py
