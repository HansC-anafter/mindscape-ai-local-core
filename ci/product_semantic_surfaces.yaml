  - id: psc.local-core.workspace-report-share-bundle.v1
    tier: P1
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/workspace-report-share-bundle-contract-2026-07-27.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Meeting Engine, internal agents, and MCP callers keep the existing tool catalog, authenticated root admission, UnifiedToolExecutor, reporting factory, and one archive writer path; no second tool, archive route, server, writer, task, queue, scheduler, or live fallback is introduced.
      - Before archive write, one WorkspaceReportDisclosureAdapter maps the bounded report graph to a neutral ArtifactDisclosureRequest, one ArtifactDisclosurePort implementation produces the deterministic per-item provenance, sensitive-content, target-scope, redaction, block, and owner-review decision, and the adapter maps that decision to one ReportBundleDisclosurePlan; tool arguments and recomputable snapshot hashes are not principal authority.
      - ArtifactDisclosurePort is a Local Core host contract and production binds exactly one LocalArtifactDisclosureService. Generic host modules must not select policy by report, tool, Meeting, agent, MCP, pack, customer, tenant, HTML, ZIP, or filename literals; the report adapter owns no classification matrix, scope query, concrete service dependency, policy fallback, or archive write.
      - One schema-validated and content-hashed host share.v1.json policy artifact is injected by the composition root into the service and report adapter. The adapter does not hard-code its profile id or version, and there is no policy DB, remote config, watcher, dynamic discovery, or same-version content replacement.
      - This revision activates only the workspace report adapter. The neutral port is not a generic DLP platform, remote service, plugin registry, worker, queue, watcher, or authorization for a second artifact adapter; any additional artifact surface requires a separate product-semantic and resource decision.
      - Distribution scopes are workspace, workspace_group, and external. Legacy payloads remain executable as workspace_only bundles; external authorization is exact to policy, graph, recipient, and verified workspace-owner review. Because this revision has no multi-owner consent ledger, group-derived external disclosure is allowed only when the verified actor, active workspace owner, group owner, and every source workspace owner are the same principal; every other owner topology fails closed as external_multi_owner_consent_unavailable.
      - Restricted content always blocks, confidential text requires derived redaction, a no-finding text scan defaults to internal rather than public, unknown binary never becomes public merely because text scanning found nothing, and active content is recorded as a review warning rather than a malware or content-disarm claim. Automated detection is defense in depth and never claims completeness.
      - The bundle preserves source files, publishes atomically inside the same workspace sandbox, keeps the existing HTML report writer unchanged, and exposes both bare and core aliases. Required linked files are never silently omitted; a security block prevents the whole archive.
      - Local dependency integrity remains explicit: missing files fail by default, security-boundary violations always fail, external or root-relative references are recorded without network fetch, and manifest entries bind source/output paths, classifications, actions, sizes, and SHA-256 digests.
      - Hard limits remain 256 source files and 128 MiB uncompressed source bytes. Workspace-owned disclosure adds zero DB statements; workspace-group provenance permits at most one indexed read per bundle and zero writes. No PgBouncer setting, worker, queue, browser, retry, SSE, polling, or remote-provider expansion is allowed.
      - A preflight result proves analysis only and creates no artifact. A completed archive receipt proves only the bounded authorized filesystem write; neither result claims report-content acceptance, durable runtime closure, product decision, release health, or work-record closure.
    path_globs:
      - backend/app/core/ports/artifact_disclosure.py
