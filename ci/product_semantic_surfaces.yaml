  - id: psc.local-core.workspace-product-capability-admission.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/tenant-product-capability-set-governance-contract-2026-07-24.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - The source Local Core is the only owner of workspace and explicit Gate0 group Product Capability Set configuration, revision-pinned effective snapshots, host readiness, and local admission; remote views read that source projection without a Site-Hub or remote mirror truth.
      - Installed and enabled packs are host readiness only, while Remote Workbench capability allowlists remain remote gateway exposure only; runtime metadata overrides, deployment providers, and CRS decisions cannot add or rewrite workspace configuration.
      - Site-Hub is one replaceable commercial Deployment Control Provider adapter whose envelope may only narrow configured surfaces; unmanaged local workspaces preserve offline operation without Site-Hub.
      - Tool, playbook, capability API, run-harness, Meeting, and background task roots share one admission facade; local execution makes zero Site-Hub or CRS calls, external-provider roots make at most one CRS call, and child phases consume the immutable snapshot.
      - Mixed-version runner parents and legacy queued tasks converge through the same parent-side admission facade before child launch; invalid or unavailable admission remains pending and cold without consuming execution retries or entering Deadletter.
      - Existing Core Settings is the only workspace and explicit active-group Product Capability Set editor: it stages a local draft, reviews the complete change, and performs one revision-checked replacement through the source Local Core; Capability Packs, Settings Assistant, public Remote Workbench, and Site-Hub storage never become alternate writers.
      - Existing workspaces without a scope row remain legacy-unmanaged; configuration-only, shadow, and enforced are explicit per-workspace reviewed states, and catalog imports or group assignments never fan out or silently change member modes.
      - Revocation keeps historical artifacts visible and already-admitted runs pinned, while configuration, admission, and workbench surfaces add no outbox, worker, queue, PgBouncer expansion, per-card request, or UX polling interval.
    path_globs:
      - backend/alembic_migrations/postgres/versions/*workspace_product_configuration*
