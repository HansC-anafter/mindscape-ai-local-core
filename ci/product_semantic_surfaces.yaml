  - id: psc.local-core.authorization-aware-knowledge-retrieval.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/authorization-aware-knowledge-retrieval-contract-2026-07-27.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Every retrievable knowledge chunk binds to one knowledge resource and one stable one-to-one security label; the current authorization revision lives only on the joined label so grant changes never require rewriting every vector, while mutable users, workspace or group roles, service principals, explicit allows, and explicit denies live in normalized grants rather than duplicated per-vector principal arrays.
      - Verified identity, workspace and group memberships, roles, permissions, topology revision, agent policy, and principal-set hash are assembled server-side in one RetrievalAccessContext; payload user or role fields can only be validated or narrow a view and never grant access.
      - KnowledgeAuthorizationService is the only authorization owner and AuthorizationAwareKnowledgeRetrievalFacade is the only knowledge-vector reader; ACL and scope predicates run before vector or keyword ranking and LIMIT, followed by one current-revision batch check before cache, prompt, citation, or caller delivery.
      - Human authorization and agent execution policy remain distinct: a result requires human_can_read, admitted scope, and an agent mask that may only narrow visibility; deny overrides allow and missing or stale resource, label, grant, or revision state fails closed.
      - Resource, security-label, grant, audit, and chunk bindings share the existing vector PostgreSQL so ingestion and ACL state commit in one transaction without an ACL projection database, dual write, outbox consumer, worker, queue, scheduler, or polling loop.
      - RLS is defense in depth behind the same service policy; runtime vector connections use one non-owner, NOSUPERUSER, NOBYPASSRLS role through the existing PgBouncer database alias and transaction pool, with no new alias, pool, reserve, session, or owner-role fallback.
      - Legacy rows preserve exact current visibility through deterministic direct-user grants; workspace or group sharing requires an explicit authorized grant, and cutover uses one facade generation with offline equivalence rather than parallel endpoints, traffic splits, or user-visible dual results.
      - The only ACL management surface extends the existing workspace governance page with one bounded summary, one selected detail, and one revision-checked complete replacement; mutation responses and the existing activity invalidation path add no autosave, N-plus-one read, per-card request, SSE route, or timer polling.
    path_globs:
      - backend/app/dependencies/auth.py
      - backend/app/services/knowledge_authorization/**
      - backend/app/services/knowledge_retrieval/**
      - backend/app/services/document_chunk_index_store.py
