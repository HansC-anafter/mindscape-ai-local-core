      - backend/tests/core/auth_dependency_spec.py
      - backend/tests/routes/core/settings_extensions_spec.py
      - backend/tests/scripts/remote_workbench_*.py
      - backend/tests/scripts/verify_remote_workbench_identity_workspace_authorization_spec.py
