  - id: psc.local-core.runner-browser-resource-governance.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/docker-browser-resource-governance-contract-2026-07-10.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Browser task admission preserves unfinished task state while deriving VM concurrency from atomic byte reservations rather than a fixed global task count.
      - OOM correlation requires a failing child plus a cgroup v2 oom_kill or oom_group_kill counter delta; a plain SIGKILL remains unclassified.
      - Resource-blocked tasks remain cold and non-runnable until one explicit control action observes a changed node-policy or resource-profile fingerprint.
      - Runner startup and periodic maintenance execute only after the durable claim gate and one VM-wide leader; same-status task writes do not emit duplicate status transitions.
      - Normal execution, startup reconciliation, and stale-task reaping release task resource leases and node reservations through one exact-owner service; terminal or requeued ownership does not wait on a long TTL during healthy operation.
      - Browser lane fairness cursor commits only after the canonical PostgreSQL pending-to-running claim succeeds; queue promotion and every admission or claim denial leave that cursor unchanged.
    path_globs:
      - backend/app/runner/cgroup_memory_events.py
      - backend/app/runner/resource_failure_policy.py
      - backend/app/runner/resource_pressure.py
      - backend/app/runner/task_executor_*.py
