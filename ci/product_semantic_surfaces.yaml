      - Local Core remains the canonical owner of workspace source assets, atomic artifacts, active-revision index projection, user and workspace authorization, bounded event delivery, and runtime activation; document_ingestion owns only portable contracts and one stateless compiler.
      - The only host binding is the existing synchronous files/analyze path delegating through file-analysis, artifact, index, and retrieval facades; existing response keys remain compatible and full schema or chunks must not enter hot event, API, task, or database payloads.
      - The native release creates no document task, worker route, queue lane, database table or migration, PgBouncer pool, frontend surface, SSE stream, timer, or polling loop; scanned and visual inputs remain explicitly degraded while OCR is disabled or vision capacity is backlogged.
      - Indexing reuses external_docs with canonical source identity and a short transactional active-revision replace only after all embeddings succeed; retrievable rows bind to the authorization-aware knowledge resource and security-label contract, whose verified principal, explicit deny, active revision, and embedding model filters run before ranking.
      - Retrieval returns exact document, revision, chunk, node, and page or slide locations; caller-side workspace post-filtering, dual writes, and direct generic rechunking are forbidden.
    path_globs:
