  - id: psc.local-core.retrievable-knowledge-projection-and-agentic-query.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/retrievable-knowledge-projection-and-agentic-query-contract-2026-07-27.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Installed owner packs compile explicitly admitted AOL objects, Artifact Manifests, memory, or documents through one neutral bounded projection descriptor; Local Core owns source admission, projection revisions, receipts, and index activation without hard-coded pack literals or a second source of truth.
      - IG, document_ingestion, and every other Cloud pack named by contracts, plans, fixtures, or canaries are evidence or compatibility scenarios only; host routes, registries, tools, schemas, migrations, prompts, and defaults never select a pack by literal, map, prefix, import, or known-pack enum, and substituting another compatible installed descriptor requires zero Local Core host implementation diff.
      - Every semantic chunk, typed record, facet, entity mention, evidence relation, community, and community report joins authorization-aware source resources and stable security labels; owner-declared and extracted relations share one evidence-graph writer, while the companion surface never owns principals, grants, deny, RLS, or a second reader.
      - Canonical entity identity may be shared only inside an admitted tenant and workspace-group boundary, while descriptions and attributes are projected from currently authorized mentions; community reports are generated per complete-grant visibility partition and become unreadable immediately when their authorization revision is stale.
      - Projection v1 preserves text, image, video, and audio evidence units through stable owner references, hashes, typed text, region, frame, and time anchors, derivative references, and per-channel receipts; the MVP activates only the text semantic channel, while a future native modality channel is an additive implementation behind the same resource identities, writer, authorization facade, public tool, and Meeting path.
      - The only public agent-facing primitive is knowledge_query with deterministic hybrid, local-graph, multi-hop, global-graph, aggregate, fetch_by_citation, and explain_coverage operations; Meeting Engine explicitly selects and composes bounded calls, and retrieval contains no hidden agent, LLM query router, or tool loop.
      - Retrieval strategy and modality are orthogonal: knowledge_query may receive only server-resolved authorized evidence references, returns typed evidence blocks plus channel and fusion revisions, rejects raw URLs, paths, base64, binaries, provider or model overrides, and never reports a media pointer as an active native multimodal channel.
      - AOL and Artifact completion emit only canonical pointers; hydration, extraction, entity resolution, community generation, and embedding reuse the existing task control plane and tool_execution type through one knowledge_indexing logical shard and one hidden internal projection tool, with no new always-on worker, scheduler, outbox consumer, poller, graph database, PgBouncer alias, or pool.
      - Structured projection preserves exact numeric, temporal, enum, row, and relation coverage even when a record is not embedded; raw binaries, complete traces, and unbounded JSON remain in owner storage and every returned claim resolves to an exact active citation.
      - Query authorization, current-revision checks, group and agent narrowing, cache identity, and RLS always delegate psc.local-core.authorization-aware-knowledge-retrieval.v1 before content reaches rerank, prompt, report, cache, or caller.
      - Projection governance extends the same bounded workspace Knowledge access surface with one summary, one selected detail, and explicit revision-checked actions; it adds no second console, N-plus-one list, autosave, SSE route, or timer polling.
    path_globs:
      - backend/app/services/knowledge_projection/**
      - backend/app/services/knowledge_retrieval/**
      - backend/app/services/knowledge_graph/**
      - backend/app/services/tools/knowledge_query/**
      - backend/app/services/tools/registry.py
      - backend/app/services/tools/registry_core/builtin.py
      - backend/app/services/orchestration/meeting/prompt_core/tool_inventory_mixin.py
      - backend/app/services/orchestration/meeting/_dispatch_pipeline.py
      - backend/app/services/object_action_closure_wiring.py
      - backend/app/services/orchestration/governance_completion.py
      - backend/app/services/task_result_landing.py
      - backend/app/services/runtime_contract_registry.py
      - backend/app/services/capability_registry.py
      - schemas/manifest.schema.yaml
      - backend/alembic.vector.ini
      - backend/alembic_migrations/vector/**
      - backend/tests/*knowledge*projection*
      - backend/tests/*knowledge*query*
      - web-console/src/app/workspaces/*/governance/**
      - web-console/src/components/workspace/governance/**

  - id: psc.local-core.durable-product-semantic-workflow-runtime.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/durable-product-semantic-workflow-contract-2026-07-25.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Local Core owns the seventeen-schema byte-identical contract mirror, one durable-state facade, one ten-table PostgreSQL ledger, deterministic reducers, signed receipts, bounded projections, review routes, and operational recovery evidence.
      - Runtime code never reads Cloud source, .contract-sources, or network contracts; schema parity is a CI/build concern and a pinned release-manifest hash is part of every semantic execution identity.
      - All protected writes require caller-owned transactions through the facade; repository leaves do not create engines or sessions, routes do not issue SQL, and runtime has no DDL fallback or unsigned receipt path.
      - Durable release-policy CAS verifies complete owner and exact-canary receipts against a caller-pinned registry hash, persists both signed receipts plus their hashes and registry revision/hash in the same immutable PostgreSQL row, and re-verifies them before admission.
      - Terminal execution enters product iteration only through mindscape.product-outcome-adapter-port.v1 and the installed runtime contract registry; generic host code contains no pack literal, known-pack map, prefix dispatch, or pack-specific import.
      - The runtime reuses the existing task lane, PgBouncer transaction pool, workspace shared EventSource, and explicit compact reads with zero new worker, queue, pool, scheduler, or polling topology.
    path_globs:
      - backend/app/services/workflow/durable_state/**
      - backend/alembic_migrations/postgres/durable_workflow_*.py
      - backend/alembic_migrations/postgres/versions/*durable_workflow*
