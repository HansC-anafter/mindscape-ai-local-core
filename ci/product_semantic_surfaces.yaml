      - Normal execution, startup reconciliation, and stale-task reaping release task resource leases and node reservations through one exact-owner service; terminal or requeued ownership does not wait on a long TTL during healthy operation.
      - Browser lane fairness cursor commits only after the canonical PostgreSQL pending-to-running claim succeeds; queue promotion and every admission or claim denial leave that cursor unchanged.
