version: 1
registry_id: mindscape.product-semantic-surfaces.local-core
updated_at: "2026-07-10"
owner_review_handle: "@team-leads"

declaration:
  allowed_values:
    - none
    - approved
  required_marker: product-semantic-change
  approval_fields:
    - semantic-decision-record
    - breaking-product-semantics-approved-by

surfaces:
  - id: psc.local-core.capability-install-control-plane.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/capability-install-control-plane-contract-2026-06-21.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Capability install uses the backend-control durable job path and preserves restart/registry sync semantics.
      - Local Core install code must not become cloud provider control-plane logic or direct pack source mutation.
    path_globs:
      - backend/app/routes/core/capability_install.py
      - backend/app/routes/core/capability_installation.py
      - backend/app/routes/core/capability_install_core/**
      - backend/app/routes/core/capability_packs.py
      - backend/app/routes/core/capability_packs_core/**
      - web-console/src/app/settings/components/panels/capability*/**
      - web-console/src/lib/capability-packs/**
    content_assertions:
      - path: backend/app/routes/core/capability_install_core/routes.py
        required_text:
          - token: _require_control_plane_install("install-from-file")
            message: File install intake must remain backend-control only.
          - token: create_file_upload_job
            message: File install intake must create a durable install job.
          - token: accepted
            message: Install intake response must preserve accepted-only semantics.
          - token: install_id
            message: Install intake response must expose durable install id.
          - token: status_url
            message: Install intake response must expose job polling URL.
          - token: _raise_db_not_ready
            message: DB recovery must surface as explicit Retry-After readiness failure.
      - path: backend/app/routes/core/capability_install_core/pipeline.py
        required_text:
          - token: ensure_core_write_ready
            message: Install pipeline must preserve DB write-readiness gate.
          - token: overwrite_review_confirmation
            message: Dirty installed-copy overwrite must preserve explicit review confirmation.
          - token: RuntimeAssetsInstaller
            message: Install pipeline must preserve runtime asset install lane.

  - id: psc.local-core.runtime-ui-asset-lane.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/runtime-ui-asset-lane-contract-2026-06-21.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Runtime UI assets are served through explicit Local Core host/static lanes and dev-proxy shell contracts.
      - Pack UI runtime assets must not be treated as cloud source files or copied into tracked generated payloads.
    path_globs:
      - backend/app/capabilities/**
      - backend/packs/**
      - web-console/dev-proxy/capability-host-shell/**
      - web-console/src/lib/capability-runtime-asset-url.ts
      - web-console/src/lib/capability-runtime-asset-url.spec.ts
      - web-console/src/lib/capability-static-hosts.ts
      - web-console/src/lib/capability-static-hosts.spec.ts
      - web-console/src/lib/capability-ui-loader*
      - web-console/src/lib/capability-ui-runtime-assets.ts
    content_assertions:
      - path: backend/app/routes/core/capability_packs_core/installed_routes.py
        required_text:
          - token: asset_url
            message: Runtime UI metadata must expose asset_url.
          - token: integrity
            message: Runtime UI metadata must expose integrity.
          - token: bytes
            message: Runtime UI metadata must expose bytes.
          - token: runtime
            message: Runtime UI metadata must expose runtime.
          - token: ui_runtime_assets.json
            message: Runtime UI metadata must read the installed runtime asset sidecar.
      - path: web-console/src/lib/capability-ui-loader.ts
        required_text:
          - token: component.asset_url
            message: Frontend loader must prefer runtime UI asset metadata.
          - token: loadRuntimeESMComponent
            message: Frontend loader must use the runtime ESM asset loader.
      - path: web-console/src/lib/capability-runtime-asset-url.ts
        required_text:
          - token: integrity
            message: Runtime asset fetch URL must preserve integrity-based cache identity.

  - id: psc.local-core.resource-console-queue-snapshot.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/resource-console-queue-snapshot-contract-2026-06-21.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Resource Console default queue utilization preserves last-known per-shard snapshot visibility.
      - Freshness fixes expose per-shard timestamps and separated resource lanes instead of narrowing queue visibility.
      - visible_lanes remains pending task route-lane identity; resource/runner lanes remain separate product fields.
    path_globs:
      - backend/app/routes/core/host_resources.py
      - backend/app/services/host_resources/**
      - backend/tests/routes/core/*host_resource*
      - backend/tests/routes/core/*queue*
      - web-console/src/app/settings/components/panels/host-resources/**
    content_assertions:
      - path: backend/app/services/host_resources/queue_utilization_snapshot_store.py
        forbidden_text:
          - token: latest_batch
            message: Default queue snapshot reader must not use latest_batch; Resource Console is per-shard last-known state.
          - token: MAX(captured_at)
            message: Default queue snapshot reader must not select a global latest timestamp without approved batch semantics.
        required_text:
          - token: DISTINCT ON (queue_shard)
            message: Default queue snapshot reader must preserve each queue shard's latest known row.
          - token: captured_at_by_queue_shard
            message: Queue snapshot responses must expose per-shard freshness.
      - path: backend/app/services/host_resources/queue_utilization_live.py
        required_text:
          - token: visible_lane_identity
            message: visible_lanes must continue to derive lane identity from pending task route projections.
          - token: read_route_identity_projections_func
            message: visible_lanes must continue to read route identity projections for pending task IDs.
          - token: lanes = visible_lanes(task_ids=task_ids, projections=projections)
            message: visible_lanes must continue to be built from pending task projections, not resource lane data.
      - path: backend/app/services/host_resources/queue_utilization.py
        required_text:
          - token: resource_lanes
            message: Resource/runner lane visibility must remain a separate product field from visible_lanes.
          - token: freshness_by_queue
            message: Snapshot/live merge must expose freshness state per queue shard.

  - id: psc.local-core.aol-runs-graph-selection-context.v1
    tier: P1
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/product-semantic-contract-index-2026-06-21.zh-TW.md#psclocal-coreaol-runs-graph-selection-contextv1
    requires_product_semantic_declaration: true
