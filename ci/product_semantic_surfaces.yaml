      - backend/app/services/knowledge_projection/facade.py
      - backend/app/routes/core/knowledge_foundation.py
      - backend/app/routes/core/vector_search.py
      - backend/app/routes/core/knowledge_authorization.py
      - backend/alembic.vector.ini
      - backend/alembic_migrations/vector/**
      - backend/tests/*knowledge*authorization*
      - backend/tests/*authorized*retrieval*
      - web-console/src/app/workspaces/*/governance/**
      - web-console/src/components/workspace/governance/**
      - web-console/src/lib/i18n/locales/*/workspace.ts
