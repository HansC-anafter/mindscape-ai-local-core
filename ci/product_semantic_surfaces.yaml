      - backend/app/services/object_runtime/**
      - backend/tests/object_runtime/**
      - backend/tests/*object*runtime*
      - web-console/src/lib/addressable-object-layer.ts
      - web-console/src/components/capabilities/aol-runtime-shell/**
      - web-console/src/components/workspace/device-binding/practice/motionPracticeGraphSelection*

  - id: psc.local-core.external-agent-run-harness-bridge.v1
    tier: P1
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/product-semantic-contract-index-2026-06-21.zh-TW.md#psclocal-coreexternal-agent-run-harness-bridgev1
    requires_product_semantic_declaration: true
