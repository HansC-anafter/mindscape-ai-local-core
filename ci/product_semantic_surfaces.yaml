  - id: psc.local-core.semantic-governance-tooling.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/semantic-governance-tooling-contract-2026-06-21.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Local Core product semantic governance changes must be traceable through registry, validator, PR declaration, CI, and owner review.
    path_globs:
      - ci/product_semantic_surfaces.yaml
      - scripts/ci/validate_product_semantics.py
      - scripts/ci/product_semantic_traceability.py
      - scripts/ci/validate_product_semantic_helper_parity.py
      - backend/tests/ci/product_semantic_helper_parity_spec.py
      - backend/tests/ci/validate_product_semantics_guard_spec.py
      - backend/tests/ci/product_semantic_validator_fixtures.py
      - backend/tests/ci/product_semantic_contract_source_spec.py
      - .github/workflows/architecture-guardrails.yml
      - .github/CODEOWNERS
      - .github/pull_request_template.md
    content_assertions:
      - path: scripts/ci/validate_product_semantics.py
        required_text:
          - token: DEFAULT_REGISTRY
            message: Product semantic validator must remain registry-driven.
          - token: yaml.safe_load
            message: Product semantic validator must load the registry as structured YAML.
          - token: content_assertions
            message: Product semantic validator must enforce registry content assertions.
          - token: _validate_workflow_path_coverage
            message: Product semantic validator must verify registry path_globs are covered by workflow path filters.
          - token: yaml.BaseLoader
            message: Product semantic validator must parse GitHub workflow YAML without losing the on key.
          - token: product_semantic_traceability
            message: Product semantic validator must call the shared traceability helper.
          - token: validate_preflight_declaration
            message: Product semantic validator must enforce Product Semantic Panoramic Preflight through the traceability helper.
          - token: validate_contract_traceability
            message: Product semantic validator must verify registry contract_doc traceability.
          - token: "--contract-root"
            message: Product semantic validator must accept an explicit cloud contract source.
