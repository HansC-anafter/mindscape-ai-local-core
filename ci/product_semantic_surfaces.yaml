  - id: psc.local-core.semantic-governance-tooling.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/semantic-governance-tooling-contract-2026-06-21.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Local Core product semantic governance changes must be traceable through registry, validator, PR declaration, CI, and owner review.
    path_globs:
      - ci/product_semantic_surfaces.yaml
      - ci/modular_entry_guardrails.yaml
      - scripts/ci/validate_modular_entrypoints.py
      - scripts/ci/modular_entry_guard_facade.py
      - backend/tests/ci/validate_modular_entrypoints_guard_spec.py
      - scripts/ci/validate_product_semantics.py
      - scripts/ci/product_semantic_traceability.py
      - scripts/ci/validate_product_semantic_helper_parity.py
      - backend/tests/ci/product_semantic_helper_parity_spec.py
      - backend/tests/ci/validate_product_semantics_guard_spec.py
      - backend/tests/ci/product_semantic_validator_fixtures.py
      - backend/tests/ci/product_semantic_contract_source_spec.py
      - .github/workflows/architecture-guardrails.yml
      - .github/CODEOWNERS
      - .github/pull_request_template.md
    content_assertions:
      - path: scripts/ci/validate_product_semantics.py
        required_text:
          - token: DEFAULT_REGISTRY
            message: Product semantic validator must remain registry-driven.
          - token: yaml.safe_load
            message: Product semantic validator must load the registry as structured YAML.
          - token: content_assertions
            message: Product semantic validator must enforce registry content assertions.
          - token: _validate_workflow_path_coverage
            message: Product semantic validator must verify registry path_globs are covered by workflow path filters.
          - token: yaml.BaseLoader
            message: Product semantic validator must parse GitHub workflow YAML without losing the on key.
          - token: product_semantic_traceability
            message: Product semantic validator must call the shared traceability helper.
          - token: validate_preflight_declaration
            message: Product semantic validator must enforce Product Semantic Panoramic Preflight through the traceability helper.
          - token: validate_contract_traceability
            message: Product semantic validator must verify registry contract_doc traceability.
          - token: "--contract-root"
            message: Product semantic validator must accept an explicit cloud contract source.
          - token: surface_ids
            message: Product semantic validator must pass registry surface hits to preflight traceability checks.
      - path: scripts/ci/product_semantic_traceability.py
        required_text:
          - token: PREFLIGHT_DECISION_RE
            message: Product semantic traceability helper must validate panoramic preflight semantic-decision values.
          - token: CONTRACT_INDEX_RELATIVE_PATH
            message: Product semantic traceability helper must verify registry entries against the contract index.
          - token: validate_contract_traceability
            message: Product semantic traceability helper must verify registry contract_doc traceability.
          - token: contract_root
            message: Product semantic traceability helper must prefer explicit contract source roots.
          - token: validate_impacted_psc_declaration
            message: Product semantic traceability helper must compare PR impacted-psc declarations with registry surface hits.
          - token: IMPACTED_PSC_RE
            message: Product semantic traceability helper must parse PR impacted-psc declarations.
      - path: scripts/ci/validate_product_semantic_helper_parity.py
        required_text:
          - token: DEFAULT_CANONICAL_HELPER
            message: Product semantic helper parity validator must know the cloud canonical helper path.
          - token: DEFAULT_LOCAL_HELPER
            message: Product semantic helper parity validator must know the local mirrored helper path.
          - token: difflib.unified_diff
            message: Product semantic helper parity validator must report drift with a unified diff.
          - token: validate_helper_parity
            message: Product semantic helper parity validator must expose a testable parity function.
      - path: backend/tests/ci/product_semantic_helper_parity_spec.py
        required_text:
          - token: test_helper_parity_accepts_identical_sources
            message: Product semantic helper parity tests must accept synced helpers.
          - token: test_helper_parity_rejects_local_drift
            message: Product semantic helper parity tests must reject local helper drift.
      - path: backend/tests/ci/validate_product_semantics_guard_spec.py
        required_text:
          - token: product_semantic_validator_fixtures
            message: Product semantic validator tests must use the shared fixture helper.
          - token: _init_repo
            message: Product semantic validator tests must keep scenario setup routed through the fixture helper.
      - path: backend/tests/ci/product_semantic_validator_fixtures.py
        required_text:
          - token: REGISTRY
            message: Product semantic validator fixture helper must own registry fixtures.
          - token: CONTRACT_INDEX
            message: Product semantic validator fixture helper must own contract-index fixtures.
          - token: preflight_none
            message: Product semantic validator fixture helper must own preserved preflight body generation.
          - token: init_repo
            message: Product semantic validator fixture helper must own temp repo setup.
          - token: run_validator
            message: Product semantic validator fixture helper must own validator subprocess execution.
      - path: .github/pull_request_template.md
        required_text:
          - token: "product-semantic-change: none"
            message: PR template must preserve product semantic declaration markers.
          - token: semantic-decision-record
            message: PR template must require decision records for approved semantic changes.
          - token: breaking-product-semantics-approved-by
            message: PR template must require owner approval for approved semantic changes.
          - token: Product Semantic Panoramic Preflight
            message: PR template must require panoramic preflight before protected semantic changes.
          - token: scope-class
            message: PR template must require the product semantic preflight scope class.
          - token: verification-mapping
            message: PR template must require validation mapping for protected semantic changes.
      - path: .github/workflows/architecture-guardrails.yml
        required_text:
          - token: device-node/**
            message: Guardrail workflow must run when registered device-node semantic surfaces change.
          - token: scripts/remote_workbench_remote_ingress_lock.py
            message: Guardrail workflow must run when the Remote Workbench ingress lock changes.
          - token: scripts/rtmp_motion_window_publisher.py
            message: Guardrail workflow must preserve the canonical motion publisher trigger.
          - token: scripts/rtmp_motion_publisher/**
            message: Guardrail workflow must preserve the canonical motion publisher module trigger.
          - token: Validate product semantics (pull request)
            message: Guardrail workflow must keep the pull-request product semantic validator step.
          - token: Validate product semantics (push)
            message: Guardrail workflow must keep the push product semantic validator step.
          - token: Checkout product semantic contract source
            message: Guardrail workflow must explicitly provision the cloud product semantic contract source.
          - token: Validate product semantic helper parity
            message: Guardrail workflow must validate local helper parity with the cloud canonical helper.
          - token: validate_product_semantic_helper_parity.py
            message: Guardrail workflow must run the helper parity validator.
          - token: "--contract-root .contract-sources/mindscape-ai-cloud"
            message: Guardrail workflow must pass the explicit cloud contract root to product semantic validation.
