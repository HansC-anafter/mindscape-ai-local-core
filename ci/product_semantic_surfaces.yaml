  - id: psc.local-core.runtime-task-read-budget.v1
    tier: P0
    owner: "@team-leads"
    contract_doc: mindscape-ai-cloud/docs/internal/local-core/product-semantics/ig-runtime-db-read-and-polling-budget-contract-2026-07-15.zh-TW.md
    requires_product_semantic_declaration: true
    semantics:
      - Task control remains in tasks while list, queue position, and capability runtime status reads use compact synchronized projections with query-shaped indexes.
      - Identical stale cache refreshes execute once per process window, retain the last known snapshot on refresh failure, and never fabricate zero queue state while another refresh is in flight.
      - DB read-path repair preserves runner capacity, queue shard visibility, PgBouncer service quality, and active task state.
      - Core schema and index changes use Alembic with concurrent large-table indexes, preflight, rollback, and original-path verification.
    path_globs:
